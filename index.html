<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="file"] {
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
        }
        button { background-color: #24292e; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #2ea44f; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Styles pour le message de succès */
        .success-message { 
            display: none; 
            background-color: #d4edda; 
            color: #155724; 
            padding: 15px; 
            border: 1px solid #c3e6cb; 
            border-radius: 4px; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <div id="form-container">
        <h2>Contact 2</h2>
        
        <form id="contact-form">
            <div class="form-group">
                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="fi-sender-lastName" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prénom :</label>
                <input type="text" id="prenom" name="fi-sender-firstName" required>
            </div>

            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" id="email" name="fi-sender-email" required>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone :</label>
                <input type="tel" id="telephone" name="fi-sender-phone">
            </div>

            <div class="form-group">
                <label for="piece-jointe">Pièce jointe :</label>
                <input type="file" id="piece-jointe" name="fi-file-document" required>
            </div>

            <button type="submit" id="submit-btn">Soumettre</button>
        </form>
    </div>

    <!-- Votre message de succès personnalisé -->
    <div id="success-block" class="success-message">
        <h3>Merci !</h3>
        <p>Votre formulaire et votre pièce jointe ont bien été transmis. Nous vous répondrons dans les plus brefs délais.</p>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Empêche le rechargement automatique de la page
            
            const form = e.target;
            const submitBtn = document.getElementById('submit-btn');
            const formData = new FormData(form);
            
            // Désactivation du bouton pendant le transfert
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours...';
        
            try {
                const response = await fetch('https://forminit.com/f/n7fmtdnb4kc', {
                    method: 'POST',
                    body: formData
                });
        
                // 1. Si tout s'est bien passé
                if (response.ok) {
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('success-block').style.display = 'block';
                } 
                // 2. Si Forminit a rejeté la saisie (Erreur 400, etc.)
                else {
                    // On extrait les détails de l'erreur renvoyés par l'API Forminit
                    const errorData = await response.json();
                    
                    // On affiche le message précis renvoyé par le serveur
                    alert(`Erreur de validation : ${errorData.message || "Une erreur est survenue."}`);
                    
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Soumettre';
                }
            } catch (error) {
                // 3. Si le problème vient d'une coupure réseau ou d'un plantage du navigateur
                alert("Erreur réseau : Impossible de joindre le serveur.");
                submitBtn.disabled = false;
                submitBtn.textContent = 'Soumettre';
            }
        });

    </script>

</body>
</html>
